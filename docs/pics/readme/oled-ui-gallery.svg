      <text x="2" y="39" font-size="5">TODAY</text><text x="50" y="39" font-size="5">61%</text><rect x="2" y="43" width="60" height="3" fill="none" stroke="#fff"/><rect x="3" y="44" width="35" height="1" fill="#fff"/>
